    <input type="checkbox" id="modal-toggle" class="modal-toggle">

    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <div class="modal-conteudo">
        <label for="modal-toggle" class="modal-fechar">&times;</label>
        <h3 id="modal-titulo">Cadastro enviado!</h3>
        <p>Obrigado por se cadastrar. Entraremos em contato em breve.</p>
        <label for="modal-toggle" class="botao botao-primario">Fechar</label>
      </div>
    </div>

    <section>
      <h2>Cadastro</h2>
      <p>Cadastre-se para apoiar nossa ONG</p>
      <div class="alerta alerta-info">
        <strong>Atenção:</strong> seus dados serão verificados em até 48 horas após o envio do formulário.
      </div>

    </section>
    <section>
      <h2>Formulários de Cadastro</h2>
      <form class="container-grid">
        <fieldset class="col-md-6">
            <legend>Dados Pessoais</legend>
            <div class="campo">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" pattern="[A-Za-zÀ-ÿ\s]+" required>
            </div>

            <div class="campo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="campo">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(41) 99999-9999" required>
            </div>

            <div class="campo">
            <label for="nasc">Data de Nascimento:</label>
            <input type="date" id="nasc" name="nascimento" class="sem-validacao-visual" required>
            </div>

            <div class="campo">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" required>
            </div>

        </fieldset>
        <fieldset class="col-md-6">
            <legend>Endereço</legend>

            <div class="campo">
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, número e complemento" required>
            </div>

            <div class="campo">
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Ex:Curitiba" pattern="[A-Za-zÀ-ÿ\s]+" required>
            </div>

            <div class="campo">
            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" placeholder="Ex:PR" pattern="[A-Za-zÀ-ÿ\s]+" required>
            </div>

            <div class="campo">
            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" required>
            </div>

        </fieldset>

        <button type="submit" class="botao botao-primario col-md-12">Enviar cadastro</button> 
      </form>
    </section>
